<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritik's Python Lab</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0d1117;
    --panel:#151b24;
    --panel2:#1b222d;
    --editor:#10151d;
    --output:#0b1016;
    --border:#293241;

    --text:#e6ebf2;
    --muted:#8994a5;

    --blue:#7aa2f7;
    --green:#7bd88f;
    --red:#f7768e;
    --yellow:#e0af68;
    --purple:#bb9af7;
    --cyan:#73daca;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(122,162,247,.07),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 100%,
            rgba(187,154,247,.05),
            transparent 28%
        ),
        var(--bg);

    color:var(--text);
    font-family:Inter,"Segoe UI",Arial,sans-serif;
}

button,
select,
input,
textarea{
    font:inherit;
}

/* ================= HEADER ================= */

header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:rgba(13,17,23,.94);
    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:50;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#202938;
    color:var(--yellow);

    font:bold 16px monospace;
}

.brand h1{
    font-size:16px;
    font-weight:650;
}

.brand p{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);
    font-size:11px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 9px rgba(123,216,143,.5);
}

/* ================= MAIN ================= */

main{
    width:min(1400px,94%);
    margin:18px auto 25px;
}

.heading{
    margin-bottom:13px;
}

.heading h2{
    font-size:21px;
    margin-bottom:3px;
}

.heading p{
    color:var(--muted);
    font-size:12px;
}

/* ================= TOOLBAR ================= */

.toolbar{
    height:45px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 11px;

    background:var(--panel);

    border:1px solid var(--border);
    border-radius:10px;

    margin-bottom:10px;
}

.toolbar-group{
    display:flex;
    align-items:center;
    gap:8px;
}

.label{
    color:var(--muted);
    font-size:11px;
}

select{
    height:29px;

    padding:0 9px;

    background:#202733;
    color:var(--text);

    border:1px solid var(--border);
    border-radius:7px;

    outline:none;

    font-size:11px;
}

select:focus{
    border-color:var(--blue);
}

/* Toggle */

.toggle{
    position:relative;
    width:34px;
    height:19px;
}

.toggle input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;

    background:#29313d;

    border-radius:20px;

    cursor:pointer;
}

.slider:before{
    content:"";

    position:absolute;

    width:13px;
    height:13px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:#9da7b6;

    transition:.18s;
}

.toggle input:checked + .slider{
    background:#304a3a;
}

.toggle input:checked + .slider:before{
    transform:translateX(15px);
    background:var(--green);
}

/* ================= WORKSPACE ================= */

.workspace{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    min-width:0;

    background:var(--panel);

    border:1px solid var(--border);
    border-radius:12px;

    overflow:hidden;
}

/* ================= CARD HEADER ================= */

.card-header{
    height:39px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:var(--panel2);

    border-bottom:1px solid var(--border);
}

.card-title{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:11px;
    font-weight:600;
}

.circle{
    width:7px;
    height:7px;
    border-radius:50%;
}

.blue{
    background:var(--blue);
}

.green{
    background:var(--green);
}

.file{
    color:#657080;
    font:10px monospace;
}

/* ================= EDITOR ================= */

.editor{
    height:390px;
    position:relative;
    background:var(--editor);
}

textarea{
    width:100%;
    height:100%;

    padding:16px;

    resize:none;
    outline:none;
    border:0;

    background:transparent;
    color:#dce4ef;

    caret-color:var(--yellow);

    font-family:
        "Cascadia Code",
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:13px;
    line-height:1.65;

    tab-size:4;
}

textarea::selection{
    background:rgba(122,162,247,.22);
}

/* ================= AUTOCOMPLETE ================= */

.autocomplete{
    position:absolute;

    display:none;

    min-width:190px;
    max-width:280px;

    max-height:210px;

    overflow-y:auto;

    background:#1b222d;

    border:1px solid #354052;

    border-radius:8px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.45);

    z-index:10;
}

.autocomplete.show{
    display:block;
}

.suggestion{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px 9px;

    cursor:pointer;

    font-family:monospace;
    font-size:11px;
}

.suggestion:hover,
.suggestion.selected{
    background:#273142;
}

.suggestion-name{
    color:var(--cyan);
}

.suggestion-type{
    color:#697588;
    font-size:9px;
}

/* ================= OUTPUT ================= */

.output{
    height:390px;

    padding:16px;

    overflow-y:auto;

    background:var(--output);

    font-family:
        "Cascadia Code",
        Consolas,
        monospace;

    font-size:12px;
    line-height:1.65;

    white-space:pre-wrap;
    word-break:break-word;
}

.placeholder{
    color:#4f5a69;
}

.normal{
    color:#d9e1ed;
}

.system{
    color:var(--cyan);
}

.success{
    color:var(--green);
}

.error{
    color:var(--red);
}

.warning{
    color:var(--yellow);
}

.info{
    color:var(--purple);
}

/* ================= INPUT ================= */

.input-box{
    display:none;

    padding:8px;

    border-top:1px solid var(--border);

    background:#121821;

    gap:7px;
}

.input-box.active{
    display:flex;
}

.input-box input{
    flex:1;

    min-width:0;

    height:31px;

    padding:0 9px;

    background:#1b222d;

    border:1px solid var(--border);

    border-radius:6px;

    outline:none;

    color:var(--text);

    font:11px monospace;
}

.input-box input:focus{
    border-color:var(--blue);
}

/* ================= CONTROLS ================= */

.controls{
    min-height:47px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px 10px;

    background:var(--panel2);

    border-top:1px solid var(--border);
}

.buttons{
    display:flex;
    gap:5px;
}

button{
    height:29px;

    padding:0 10px;

    border-radius:6px;

    border:1px solid var(--border);

    background:#202733;

    color:var(--text);

    cursor:pointer;

    font-size:10px;
    font-weight:600;

    transition:.15s;
}

button:hover{
    background:#2a3341;
}

.run{
    color:var(--green);
    background:#26392f;
    border-color:#385647;
}

.stop{
    color:var(--red);
    background:#38262c;
    border-color:#57363f;
}

.shortcut{
    color:#5f6979;
    font-size:9px;
}

kbd{
    padding:2px 5px;

    background:#202733;

    border:1px solid var(--border);

    border-radius:4px;
}

/* ================= FOOTER ================= */

.footer{
    display:flex;
    justify-content:space-between;

    margin-top:10px;

    color:#596474;

    font-size:10px;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .workspace{
        grid-template-columns:1fr;
    }

    .editor,
    .output{
        height:330px;
    }

    header{
        padding:0 15px;
    }

    .status{
        display:none;
    }

}

@media(max-width:500px){

    main{
        width:95%;
    }

    .toolbar{
        height:auto;
        min-height:45px;
        padding:7px 9px;
        gap:8px;
    }

    .toolbar-group{
        flex-wrap:wrap;
    }

    .footer{
        flex-direction:column;
        gap:4px;
    }

}

</style>
</head>


<body>

<header>

    <div class="brand">

        <div class="logo">
            Py
        </div>

        <div>
            <h1>Ritik's Python Lab</h1>
            <p>Write Python. See it happen.</p>
        </div>

    </div>


    <div class="status">

        <span
            id="statusDot"
            class="status-dot">
        </span>

        <span id="statusText">
            Loading Python...
        </span>

    </div>

</header>


<main>

    <div class="heading">

        <h2>Python Playground</h2>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

                    Python Code

                </div>

                <span class="file">
                    main.py
                </span>

            </div>


            <div class="editor">

<textarea
id="code"
spellcheck="false"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
>name = "Ritik"

for i in range(5):
    print("Hello", name)
    print("Number:", i)</textarea>


                <div
                    id="autocomplete"

    <div class="footer">

<script>

/* =====================================================
   SETTINGS
===================================================== */

const MAX_RUNTIME = 10000;


/* =====================================================
   STATE
===================================================== */

let worker = null;

let pythonReady = false;

let loading = false;

let running = false;

let waitingInput = false;

let autoTimer = null;

let safetyTimer = null;

let executionId = 0;

let workerStarting = false;


/* =====================================================
   ELEMENTS
===================================================== */

const code =
    document.getElementById("code");

const output =
    document.getElementById("output");

const inputBox =
    document.getElementById("inputBox");

const input =
    document.getElementById("input");

const autoRun =
    document.getElementById("autoRun");

const suggestionToggle =
    document.getElementById("suggestions");

const autocomplete =
    document.getElementById("autocomplete");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");



/* =====================================================
   STATUS
===================================================== */

function status(
    text,
    type = "normal"
){

    statusText.textContent = text;


    if(type === "error"){

        statusDot.style.background =
            "var(--red)";

        statusDot.style.boxShadow =
            "0 0 9px rgba(247,118,142,.5)";

    }

    else if(type === "waiting"){

        statusDot.style.background =
            "var(--yellow)";

        statusDot.style.boxShadow =
            "0 0 9px rgba(224,175,104,.5)";

    }

    else{

        statusDot.style.background =
            "var(--green)";

        statusDot.style.boxShadow =
            "0 0 9px rgba(123,216,143,.5)";

    }

}



/* =====================================================
   OUTPUT
===================================================== */

function clearOutput(){

    output.innerHTML =
        `<div class="placeholder">
            Python output will appear here...
        </div>`;

}


function printOutput(
    text,
    type = "normal"
){

    const placeholder =
        output.querySelector(".placeholder");

    if(placeholder){
        placeholder.remove();
    }


    const line =
        document.createElement("div");

    line.className = type;

    line.textContent = text;

    output.appendChild(line);


    output.scrollTop =
        output.scrollHeight;

}



/* =====================================================
   ERROR EXPLANATION
===================================================== */

function explainError(error){

    let title = "Python Error";

    let why =
        "Python could not complete your program.";

    let fix =
        "Read the line shown in the traceback and check the code around it.";


    if(error.includes("SyntaxError")){

        title = "Syntax Error";

        why =
            "Python found code that does not follow Python's syntax.";

        fix =
            "Check brackets, quotes, colons (:), spelling and indentation.";

    }

    else if(error.includes("IndentationError")){

        title = "Indentation Error";

        why =
            "Python uses indentation to know which code belongs inside a block.";

        fix =
            "Use consistent indentation. Usually 4 spaces are used.";

    }

    else if(error.includes("NameError")){

        title = "Name Error";

        why =
            "Python cannot find the variable or function name you used.";

        fix =
            "Check the spelling or create the variable before using it.";

    }

    else if(error.includes("TypeError")){

        title = "Type Error";

        why =
            "Two values are being used in a way their data types do not allow.";

        fix =
            "Check the types. You may need int(), float(), str() or another conversion.";

    }

    else if(error.includes("ValueError")){

        title = "Value Error";

        why =
            "The value has the wrong form for the operation.";

        fix =
            "Check the value before converting or processing it.";

    }

    else if(error.includes("ZeroDivisionError")){

        title = "Division by Zero";

        why =
            "Your program tried to divide a number by zero.";

        fix =
            "Make sure the value you divide by is not 0.";

    }

    else if(error.includes("IndexError")){

        title = "Index Error";

        why =
            "You tried to access a list or string position that does not exist.";

        fix =
            "Check the length of the list and use a valid index.";

    }

    else if(error.includes("KeyError")){

        title = "Key Error";

        why =
            "The dictionary key you requested does not exist.";

        fix =
            "Check the key spelling or use dictionary.get(key).";

    }

    else if(error.includes("AttributeError")){

        title = "Attribute Error";

        why =
            "The object does not have the method or property you requested.";

        fix =
            "Check the object's type and the spelling of the method.";

    }


    printOutput(
        "",
        "error"
    );

    printOutput(
        "❌ " + title,
        "error"
    );

    printOutput(
        "Why:",
        "warning"
    );

    printOutput(
        why
    );

    printOutput(
        "How to fix:",
        "warning"
    );

    printOutput(
        fix
    );

}



/* =====================================================
   PYTHON WORKER
===================================================== */

function createWorker(){

    if(worker){
        worker.terminate();
    }


    pythonReady = false;

    workerStarting = true;


    const workerCode = `

        let pyodide = null;

        let inputResolver = null;


        async function start(){

            try{

                self.postMessage({
                    type:"loading"
                });


                const py =
                    await import(
                        "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.mjs"
                    );


                pyodide =
                    await py.loadPyodide();


                self.postMessage({
                    type:"ready"
                });

            }

            catch(error){

                self.postMessage({
                    type:"loadError",
                    message:String(error)
                });

            }

        }


        self.onmessage =
        async function(event){

            const data =
                event.data;


            /* -----------------
               INPUT
            ----------------- */

            if(
                data.type === "input"
            ){

                if(inputResolver){

                    inputResolver(
                        data.value
                    );

                    inputResolver = null;

                }

                return;

            }


            /* -----------------
               RUN
            ----------------- */

            if(
                data.type === "run"
            ){

                if(!pyodide){

                    self.postMessage({
                        type:"error",
                        message:
                        "Python is still loading."
                    });

                    return;

                }


                try{

                    pyodide.setStdout({

                        batched(message){

                            self.postMessage({
                                type:"stdout",
                                message:message
                            });

                        }

                    });


                    pyodide.setStderr({

                        batched(message){

                            self.postMessage({
                                type:"stderr",
                                message:message
                            });

                        }

                    });


                    /*
                       Custom input()
                    */

                    globalThis.pythonInput =
                    function(prompt){

                        self.postMessage({
                            type:"inputRequest",
                            prompt:prompt || ""
                        });


                        return new Promise(
                            resolve => {

                                inputResolver =
                                    resolve;

                            }
                        );

                    };


                    /*
                       Install custom input
                    */

                    await pyodide.runPythonAsync(\`

import builtins
from js import pythonInput

async def custom_input(prompt=""):
    return await pythonInput(prompt)

builtins.input = custom_input

                    \`);


                    await pyodide.runPythonAsync(
                        data.code
                    );


                    self.postMessage({
                        type:"finished"
                    });

                }

                catch(error){

                    self.postMessage({
                        type:"pythonError",
                        message:String(error)
                    });

                }

            }

        };


        start();

    `;


    const blob =
        new Blob(
            [workerCode],
            {
                type:
                "application/javascript"
            }
        );


    worker =
        new Worker(
            URL.createObjectURL(blob),
            {
                type:"module"
            }
        );


    worker.onmessage =
        handleWorkerMessage;


    worker.onerror =
        function(error){

            running = false;

            status(
                "Worker Error",
                "error"
            );

            printOutput(
                "Python worker stopped unexpectedly.",
                "error"
            );

        };

}



/* =====================================================
   WORKER MESSAGES
===================================================== */

function handleWorkerMessage(event){

    const data =
        event.data;


    if(data.type === "loading"){

        loading = true;

        status(
            "Loading Python...",
            "waiting"
        );

        return;
    }


    if(data.type === "ready"){

        loading = false;

        pythonReady = true;

        workerStarting = false;

        status("Ready");

        return;
    }


    if(data.type === "loadError"){

        loading = false;

        pythonReady = false;

        status(
            "Load Error",
            "error"
        );

        printOutput(
            data.message,
            "error"
        );

        return;
    }


    if(data.type === "stdout"){

        printOutput(
            data.message,
            "normal"
        );

        return;
    }


    if(data.type === "stderr"){

        printOutput(
            data.message,
            "error"
        );

        return;
    }


    if(data.type === "inputRequest"){

        waitingInput = true;

        inputBox.classList.add(
            "active"
        );

        input.focus();


        if(data.prompt){

            printOutput(
                data.prompt,
                "system"
            );

        }

        return;
    }


    if(data.type === "finished"){

        running = false;

        waitingInput = false;

        inputBox.classList.remove(
            "active"
        );

        clearSafetyTimer();

        status("Finished");

        printOutput(
            "✓ Program finished.",
            "success"
        );

        return;
    }


    if(data.type === "pythonError"){

        running = false;

        waitingInput = false;

        inputBox.classList.remove(
            "active"
        );

        clearSafetyTimer();

        status(
            "Error",
            "error"
        );

        explainError(
            data.message
        );

        return;
    }


    if(data.type === "error"){

        running = false;

        status(
            "Error",
            "error"
        );

        printOutput(
            data.message,
            "error"
        );

    }

}



/* =====================================================
   RUN
===================================================== */

async function runPython(){

    executionId++;

    const myExecution =
        executionId;


    clearSafetyTimer();


    /*
       Cancel old program
    */

    if(running){

        running = false;

        waitingInput = false;

        inputBox.classList.remove(
            "active"
        );

    }


    const source =
        code.value;


    if(!source.trim()){

        clearOutput();

        printOutput(
            "Write some Python code first.",
            "warning"
        );

        return;

    }


    clearOutput();


    status(
        "Preparing...",
        "waiting"
    );


    /*
       Python is already loaded.
       Therefore execution starts
       immediately.
    */

    if(
        !pythonReady
    ){

        printOutput(
            "Python is still loading...",
            "system"
        );


        /*
           Wait until ready
        */

        await waitForPython();


        if(
            myExecution !== executionId
        ){
            return;
        }

    }


    if(
        !pythonReady ||
        !worker
    ){

        printOutput(
            "Python could not start.",
            "error"
        );

        status(
            "Error",
            "error"
        );

        return;

    }


    running = true;


    status(
        "Running",
        "waiting"
    );


    printOutput(
        "▶ Running...",
        "system"
    );


    worker.postMessage({

        type:"run",

        code:source

    });


    startSafetyTimer();

}



/* =====================================================
   WAIT FOR PYTHON
===================================================== */

function waitForPython(){

    return new Promise(
        resolve => {

            const start =
                Date.now();


            const timer =
                setInterval(
                    function(){

                        if(
                            pythonReady
                        ){

                            clearInterval(
                                timer
                            );

                            resolve();

                        }


                        if(
                            Date.now() -
                            start >
                            15000
                        ){

                            clearInterval(
                                timer
                            );

                            resolve();

                        }

                    },
                    50
                );

        }
    );

}



/* =====================================================
   STOP
===================================================== */

function stopPython(
    message = "■ Program stopped."
){

    executionId++;


    clearSafetyTimer();


    if(worker){

        worker.terminate();

        worker = null;

    }


    pythonReady = false;

    running = false;

    waitingInput = false;


    inputBox.classList.remove(
        "active"
    );


    status(
        "Stopped",
        "error"
    );


    printOutput(
        message,
        "error"
    );


    /*
       IMPORTANT:
       Start the Python engine again
       immediately.

       User doesn't have to press
       anything.
    */

    createWorker();

}



/* =====================================================
   SAFETY TIMER
===================================================== */

function startSafetyTimer(){

    clearSafetyTimer();


    safetyTimer =
        setTimeout(
            function(){

                if(
                    running
                ){

                    stopPython(
                        "⚠ Program automatically stopped after 10 seconds."
                    );

                }

            },
            MAX_RUNTIME
        );

}


function clearSafetyTimer(){

    if(
        safetyTimer
    ){

        clearTimeout(
            safetyTimer
        );

        safetyTimer = null;

    }

}



/* =====================================================
   AUTO RUN
===================================================== */

function scheduleAutoRun(){

    if(autoTimer){

        clearTimeout(
            autoTimer
        );

        autoTimer = null;

    }


    const delay =
        Number(
            autoRun.value
        );


    if(
        delay === 0
    ){

        status(
            pythonReady ?
            "Ready" :
            "Loading Python...",
            pythonReady ?
            "normal" :
            "waiting"
        );

        return;

    }


    if(
        !code.value.trim()
    ){

        return;

    }


    let remaining =
        Math.ceil(
            delay / 1000
        );


    status(
        "Waiting " +
        remaining +
        "s...",
        "waiting"
    );


    const started =
        Date.now();


    autoTimer =
        setTimeout(
            function(){

                /*
                   If user has changed the code,
                   this timer would have already
                   been cancelled.
                */

                if(
                    code.value.trim()
                ){

                    runPython();

                }

            },
            delay
        );

}



/* =====================================================
   CODE CHANGE
===================================================== */

code.addEventListener(
    "input",
    function(){

        /*
           If program is running,
           automatically stop old execution.

           User can simply continue typing.
        */

        if(running){

            stopPython(
                "Previous run stopped. Waiting for your new code..."
            );

        }


        updateAutocomplete();


        /*
           Auto run
        */

        scheduleAutoRun();

    }
);



/* =====================================================
   AUTO RUN CHANGE
===================================================== */

autoRun.addEventListener(
    "change",
    function(){

        if(autoTimer){

            clearTimeout(
                autoTimer
            );

            autoTimer = null;

        }


        scheduleAutoRun();

    }
);



/* =====================================================
   INPUT SEND
===================================================== */

function sendInput(){

    if(
        !waitingInput
    ){

        return;

    }


    const value =
        input.value;


    printOutput(
        "> " + value,
        "normal"
    );


    if(worker){

        worker.postMessage({

            type:"input",

            value:value

        });

    }


    input.value = "";

    waitingInput = false;

    inputBox.classList.remove(
        "active"
    );

}


document
.getElementById("send")
.addEventListener(
    "click",
    sendInput
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendInput();

        }

    }
);

let suggestionItems = [];

let selectedSuggestion = 0;



/* =====================================================
   GET CURRENT WORD
===================================================== */

function getCurrentWord(){

    const cursor =
        code.selectionStart;


    const before =
        code.value.slice(
            0,
            cursor
        );


    const match =
        before.match(
            /[A-Za-z_][A-Za-z0-9_]*$/
        );


    return {

        word:
            match ?
            match[0] :
            "",

        start:
            match ?
            cursor -
            match[0].length :
            cursor

    };

}



/* =====================================================
   UPDATE AUTOCOMPLETE
===================================================== */

function updateAutocomplete(){

    if(
        !suggestionToggle.checked
    ){

        hideAutocomplete();

        return;

    }


    const current =
        getCurrentWord();


    const word =
        current.word.toLowerCase();


    if(
        word.length < 1
    ){

        hideAutocomplete();

        return;

    }


    suggestionItems =
        keywords.filter(
            item =>
                item.word
                .toLowerCase()
                .startsWith(word)
        );


    if(
        suggestionItems.length === 0
    ){

        hideAutocomplete();

        return;

    }


    selectedSuggestion = 0;


    autocomplete.innerHTML = "";


    suggestionItems
    .forEach(
        function(item,index){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "suggestion" +
                (
                    index === 0 ?
                    " selected" :
                    ""
                );


            div.innerHTML = `
                <span class="suggestion-name">
                    ${item.insert}
                </span>

                <span class="suggestion-type">
                    ${item.type}
                </span>
            `;


            div.addEventListener(
                "mousedown",
                function(event){

                    event.preventDefault();

                    insertSuggestion(
                        index
                    );

                }
            );


            autocomplete.appendChild(
                div
            );

        }
    );


    positionAutocomplete();

    autocomplete.classList.add(
        "show"
    );

}



/* =====================================================
   POSITION AUTOCOMPLETE
===================================================== */

function positionAutocomplete(){

    /*
       Simple fixed position inside editor.
       Keeps the popup visible without
       interfering with typing.
    */

    autocomplete.style.left =
        "16px";

    autocomplete.style.bottom =
        "12px";

}



/* =====================================================
   HIDE
===================================================== */

function hideAutocomplete(){

    autocomplete.classList.remove(
        "show"
    );

}



/* =====================================================
   INSERT SUGGESTION
===================================================== */

function insertSuggestion(index){

    const item =
        suggestionItems[index];


    if(!item){
        return;
    }


    const current =
        getCurrentWord();


    const before =
        code.value.slice(
            0,
            current.start
        );


    const after =
        code.value.slice(
            code.selectionStart
        );


    code.value =
        before +
        item.insert +
        after;


    const newCursor =
        current.start +
        item.insert.length;


    code.selectionStart =
        newCursor;

    code.selectionEnd =
        newCursor;


    hideAutocomplete();


    code.focus();


    /*
       Schedule auto-run again
    */

    scheduleAutoRun();

}



/* =====================================================
   AUTOCOMPLETE KEYBOARD
===================================================== */

code.addEventListener(
    "keydown",
    function(event){

        if(
            autocomplete.classList.contains(
                "show"
            )
        ){

            /*
               DOWN
            */

            if(
                event.key === "ArrowDown"
            ){

                event.preventDefault();


                selectedSuggestion =
                    (
                        selectedSuggestion + 1
                    ) %
                    suggestionItems.length;


                refreshSelection();

                return;

            }


            /*
               UP
            */

            if(
                event.key === "ArrowUp"
            ){

                event.preventDefault();


                selectedSuggestion =
                    (
                        selectedSuggestion -
                        1 +
                        suggestionItems.length
                    ) %
                    suggestionItems.length;


                refreshSelection();

                return;

            }


            /*
               ENTER
            */

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                insertSuggestion(
                    selectedSuggestion
                );

                return;

            }


            /*
               TAB
            */

            if(
                event.key === "Tab"
            ){

                event.preventDefault();

                insertSuggestion(
                    selectedSuggestion
                );

                return;

            }


            /*
               ESC
            */

            if(
                event.key === "Escape"
            ){

                hideAutocomplete();

                return;

            }

        }


        /*
           Ctrl + Enter
        */

        if(
            event.ctrlKey &&
            event.key === "Enter"
        ){

            event.preventDefault();

            if(autoTimer){

                clearTimeout(
                    autoTimer
                );

                autoTimer = null;

            }

            runPython();

            return;

        }


        /*
           TAB without suggestion
        */

        if(
            event.key === "Tab"
        ){

            event.preventDefault();


            const start =
                this.selectionStart;

            const end =
                this.selectionEnd;


            this.value =
                this.value.slice(
                    0,
                    start
                ) +
                "    " +
                this.value.slice(
                    end
                );


            this.selectionStart =
                this.selectionEnd =
                start + 4;

        }

    }
);



/* =====================================================
   REFRESH SELECTED SUGGESTION
===================================================== */

function refreshSelection(){

    const items =
        autocomplete.querySelectorAll(
            ".suggestion"
        );


    items.forEach(
        function(item,index){

            item.classList.toggle(
                "selected",
                index ===
                selectedSuggestion
            );

        }
    );

}
