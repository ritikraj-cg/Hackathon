```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Space Runner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #02030a;
    font-family: Arial, sans-serif;
    color: white;
    user-select: none;
}

/* GAME */
#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    perspective: 800px;
    background:
        radial-gradient(circle at 50% 30%, #17245e 0%, #070a22 35%, #010208 75%);
}

/* STARS */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
}

/* HUD */
#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
    display: flex;
    gap: 15px;
}

.box {
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,180,255,.15);
}

.box span {
    color: #00eaff;
    font-weight: bold;
}

/* ROAD */
#road {
    position: absolute;
    width: 75vw;
    height: 160vh;
    left: 50%;
    top: 20%;
    transform:
        translateX(-50%)
        rotateX(65deg);
    transform-origin: center top;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 9vw,
            rgba(0,220,255,.18) 9.2vw,
            transparent 9.5vw
        ),
        repeating-linear-gradient(
            0deg,
            rgba(0,220,255,.10) 0px,
            rgba(0,220,255,.10) 3px,
            transparent 4px,
            transparent 70px
        ),
        linear-gradient(
            90deg,
            #050713,
            #0c1230,
            #050713
        );

    border-left: 4px solid #00eaff;
    border-right: 4px solid #00eaff;

    box-shadow:
        0 0 30px #00eaff,
        inset 0 0 80px rgba(0,200,255,.3);
}

/* ROAD GLOW */
#road::before,
#road::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 100%;
    top: 0;
    background: #00eaff;
    filter: blur(15px);
}

#road::before {
    left: -10px;
}

#road::after {
    right: -10px;
}

/* PLAYER */
#player {
    position: absolute;
    width: 75px;
    height: 110px;
    left: 50%;
    bottom: 55px;
    transform: translateX(-50%);
    z-index: 20;
    transition: left .12s ease;
}

/* CAR BODY */
.car-body {
    position: absolute;
    width: 70px;
    height: 90px;
    left: 3px;
    top: 10px;

    background:
        linear-gradient(
            90deg,
            #061a27,
            #00c8ff,
            #063247,
            #00eaff
        );

    clip-path: polygon(
        25% 0,
        75% 0,
        100% 65%,
        78% 100%,
        22% 100%,
        0 65%
    );

    box-shadow:
        0 0 15px #00eaff,
        0 0 35px rgba(0,220,255,.6);
}

/* CAR GLASS */
.car-glass {
    position: absolute;
    width: 42px;
    height: 35px;
    left: 17px;
    top: 18px;

    background:
        linear-gradient(
            135deg,
            #b8f7ff,
            #075d8a
        );

    clip-path: polygon(
        15% 0,
        85% 0,
        100% 80%,
        0 80%
    );

    box-shadow: 0 0 15px #00eaff;
}

/* CAR LIGHTS */
.light {
    position: absolute;
    width: 10px;
    height: 20px;
    background: #ffffff;
    box-shadow: 0 0 15px white;
    bottom: 10px;
}

.light.left {
    left: 12px;
}

.light.right {
    right: 12px;
}

/* OBSTACLE */
.obstacle {
    position: absolute;
    width: 65px;
    height: 65px;
    background:
        linear-gradient(
            135deg,
            #ff1744,
            #7a0018
        );

    border: 3px solid #ff5272;
    box-shadow:
        0 0 15px #ff1744,
        0 0 40px rgba(255,0,60,.6);

    transform: translate(-50%, -50%) rotate(45deg);
    z-index: 10;
}

/* COIN */
.coin {
    position: absolute;
    width: 35px;
    height: 35px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff7a0,
            #ffd000 45%,
            #ff8c00
        );

    border: 3px solid #fff4a3;

    box-shadow:
        0 0 15px #ffd000,
        0 0 35px #ff9d00;

    transform: translate(-50%, -50%);
    z-index: 9;

    animation: coinSpin .7s linear infinite;
}

@keyframes coinSpin {
    0% {
        transform: translate(-50%, -50%) rotateY(0deg);
    }

    50% {
        transform: translate(-50%, -50%) rotateY(90deg);
    }

    100% {
        transform: translate(-50%, -50%) rotateY(180deg);
    }
}

/* START SCREEN */
#startScreen,
#gameOver {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            rgba(0,100,180,.3),
            rgba(0,0,0,.85)
        );

    z-index: 200;
}

.panel {
    width: min(500px, 90%);
    padding: 45px;
    text-align: center;

    border: 1px solid rgba(0,234,255,.4);
    border-radius: 25px;

    background: rgba(2,8,25,.75);
    backdrop-filter: blur(20px);

    box-shadow:
        0 0 50px rgba(0,200,255,.2);
}

h1 {
    font-size: clamp(40px, 7vw, 75px);
    color: #00eaff;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #008cff;
    margin-bottom: 15px;
}

.panel p {
    color: #b9c9e8;
    margin: 10px 0;
    line-height: 1.6;
}

button {
    margin-top: 25px;
    padding: 15px 35px;

    border: none;
    border-radius: 50px;

    background: linear-gradient(
        90deg,
        #00eaff,
        #0066ff
    );

    color: white;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(0,220,255,.5);

    transition: .2s;
}

button:hover {
    transform: scale(1.08);
    box-shadow:
        0 0 35px rgba(0,220,255,.9);
}

/* GAME OVER */
#gameOver {
    display: none;
}

/* MOBILE CONTROLS */
#controls {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 150;

    display: flex;
    gap: 20px;
}

.control {
    width: 65px;
    height: 65px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: rgba(0,220,255,.12);
    border: 1px solid rgba(0,220,255,.4);

    color: #00eaff;
    font-size: 28px;

    cursor: pointer;

    backdrop-filter: blur(10px);
}

.control:active {
    transform: scale(.9);
}

/* RESPONSIVE */
@media(max-width:600px) {

    #road {
        width: 120vw;
    }

    .box {
        padding: 8px 12px;
        font-size: 13px;
    }

    #player {
        transform: translateX(-50%) scale(.85);
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- HUD -->
    <div id="hud">
        <div class="box">
            SCORE:
            <span id="score">0</span>
        </div>

        <div class="box">
            COINS:
            <span id="coins">0</span>
        </div>

        <div class="box">
            SPEED:
            <span id="speed">1</span>
        </div>
    </div>

    <!-- ROAD -->
    <div id="road"></div>

    <!-- PLAYER -->
    <div id="player">

        <div class="car-body"></div>

        <div class="car-glass"></div>

        <div class="light left"></div>
        <div class="light right"></div>

    </div>

    <!-- MOBILE CONTROLS -->
    <div id="controls">

        <div class="control" id="leftBtn">
            ◀
        </div>

        <div class="control" id="rightBtn">
            ▶
        </div>

    </div>

    <!-- START -->
    <div id="startScreen">

        <div class="panel">

            <h1>NEON RUSH</h1>

            <p>
                Enter the futuristic highway.
            </p>

            <p>
                Dodge obstacles • Collect coins • Survive
            </p>

            <p>
                <b>Keyboard:</b> ← → or A / D
            </p>

            <button onclick="startGame()">
                START GAME
            </button>

        </div>

    </div>

    <!-- GAME OVER -->
    <div id="gameOver">

        <div class="panel">

            <h1>GAME OVER</h1>

            <p>
                Your Score:
                <b id="finalScore">0</b>
            </p>

            <p>
                Coins:
                <b id="finalCoins">0</b>
            </p>

            <button onclick="restartGame()">
                PLAY AGAIN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const speedText = document.getElementById("speed");

const gameOverScreen = document.getElementById("gameOver");
const startScreen = document.getElementById("startScreen");

const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");

let playerLane = 1;

let lanes = [35, 50, 65];

let score = 0;
let coins = 0;

let speed = 5;

let running = false;

let obstacles = [];
let coinObjects = [];

let spawnTimer;
let coinTimer;
let gameLoop;


/* =========================
   CREATE STARS
========================= */

for(let i = 0; i < 100; i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.opacity =
        Math.random() * .8 + .2;

    star.style.transform =
        `scale(${Math.random() * 2 + .5})`;

    game.appendChild(star);
}


/* =========================
   PLAYER MOVEMENT
========================= */

function moveLeft(){

    if(!running) return;

    if(playerLane > 0){

        playerLane--;

        updatePlayerPosition();
    }
}


function moveRight(){

    if(!running) return;

    if(playerLane < 2){

        playerLane++;

        updatePlayerPosition();
    }
}


function updatePlayerPosition(){

    player.style.left =
        lanes[playerLane] + "%";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){

        moveLeft();

    }

    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){

        moveRight();

    }

});


/* =========================
   MOBILE BUTTONS
========================= */

document.getElementById("leftBtn")
.addEventListener("click", moveLeft);

document.getElementById("rightBtn")
.addEventListener("click", moveRight);


/* =========================
   START GAME
========================= */

function startGame(){

    startScreen.style.display = "none";

    running = true;

    score = 0;
    coins = 0;

    speed = 5;

    playerLane = 1;

    updatePlayerPosition();

    scoreText.textContent = 0;
    coinsText.textContent = 0;
    speedText.textContent = 1;

    spawnTimer =
        setInterval(createObstacle, 900);

    coinTimer =
        setInterval(createCoin, 700);

    gameLoop =
        requestAnimationFrame(updateGame);
}


/* =========================
   CREATE OBSTACLE
========================= */

function createObstacle(){

    if(!running) return;

    const obstacle =
        document.createElement("div");

    obstacle.className = "obstacle";

    const lane =
        Math.floor(Math.random() * 3);

    obstacle.dataset.lane = lane;

    obstacle.style.left =
        lanes[lane] + "%";

    obstacle.style.top = "-100px";

    game.appendChild(obstacle);

    obstacles.push({
        element: obstacle,
        y: -100,
        lane: lane
    });
}


/* =========================
   CREATE COIN
========================= */

function createCoin(){

    if(!running) return;

    const coin =
        document.createElement("div");

    coin.className = "coin";

    const lane =
        Math.floor(Math.random() * 3);

    coin.style.left =
        lanes[lane] + "%";

    coin.style.top = "-50px";

    game.appendChild(coin);

    coinObjects.push({
        element: coin,
        y: -50,
        lane: lane
    });
}


/* =========================
   GAME LOOP
========================= */

function updateGame(){

    if(!running) return;

    /* SCORE */

    score += 0.03;

    scoreText.textContent =
        Math.floor(score);


    /* SPEED */

    speed =
        5 + Math.floor(score / 100);

    speedText.textContent =
        Math.floor(speed / 5);


    /* OBSTACLES */

    obstacles.forEach((obj, index) => {

        obj.y += speed;

        obj.element.style.top =
            obj.y + "px";

        /* COLLISION */

        if(
            obj.y > window.innerHeight - 180 &&
            obj.y < window.innerHeight - 60 &&
            obj.lane === playerLane
        ){

            endGame();

        }


        /* REMOVE */

        if(obj.y > window.innerHeight + 100){

            obj.element.remove();

            obstacles.splice(index, 1);

        }

    });


    /* COINS */

    coinObjects.forEach((obj, index) => {

        obj.y += speed;

        obj.element.style.top =
            obj.y + "px";


        /* COLLECT */

        if(
            obj.y > window.innerHeight - 190 &&
            obj.y < window.innerHeight - 50 &&
            obj.lane === playerLane
        ){

            coins++;

            coinsText.textContent =
                coins;

            obj.element.remove();

            coinObjects.splice(index, 1);

        }


        /* REMOVE */

        if(obj.y > window.innerHeight + 100){

            obj.element.remove();

            coinObjects.splice(index, 1);

        }

    });


    gameLoop =
        requestAnimationFrame(updateGame);
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(!running) return;

    running = false;

    clearInterval(spawnTimer);
    clearInterval(coinTimer);

    cancelAnimationFrame(gameLoop);

    finalScore.textContent =
        Math.floor(score);

    finalCoins.textContent =
        coins;

    gameOverScreen.style.display =
        "flex";
}


/* =========================
   RESTART
========================= */

function restartGame(){

    obstacles.forEach(obj =>
        obj.element.remove()
    );

    coinObjects.forEach(obj =>
        obj.element.remove()
    );

    obstacles = [];
    coinObjects = [];

    gameOverScreen.style.display =
        "none";

    startGame();
}


/* =========================
   INITIAL POSITION
========================= */

updatePlayerPosition();

</script>

</body>
</html>
